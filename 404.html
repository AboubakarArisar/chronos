<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Not on any map · Chronos</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/src/app.css">
<style>
  body{display:flex;align-items:center;justify-content:center;padding:24px;background:#020306 radial-gradient(ellipse at 50% 40%,#1a2a44 0,#020306 70%)}
  .lost{position:relative;width:min(460px,100%);padding:0 0 22px;text-align:center}
  .lost h1{font-family:var(--head);font-weight:900;font-size:34px;margin:6px 24px 4px}
  .lost p{margin:0 28px 16px;font-size:17px;line-height:1.45}
  .lost .yr{font-family:var(--head);font-size:13px;letter-spacing:.25em;color:var(--ink2)}
  .lost .btns{padding:0 24px}
</style>
</head>
<body data-skin="default" data-stud="diamond">
<main class="frame lost" style="position:relative">
  <div class="strip" style="background:var(--gold)"></div>
  <div class="yr">ERROR 404</div>
  <h1 class="engraved">Terra incognita</h1>
  <p>This page is not on any of our maps. It may have moved, or the link may be mistyped.</p>
  <div class="btns"><a class="btn" href="/app.html">Open the globe</a><a class="btn ghost" href="/index.html">Back to the start</a></div>
  <i class="stud tl"></i><i class="stud tr"></i><i class="stud bl"></i><i class="stud br"></i>
</main>
<script type="module">import '@fontsource/cinzel/700.css'; import '@fontsource/cinzel/900.css'; import '@fontsource/alegreya/400.css';</script>

</html>
